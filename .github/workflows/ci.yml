name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The tests drive a real browser; Chromium comes with the ffmpeg build that Playwright needs to record.
      - name: Install Playwright browser and system dependencies
        run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run typecheck
      # E0.19 step 6: the protection gate. Blocks on a step back in understanding, a broken wrong-PASS trap, or a wrong PASS in the
      # saved live runs; and, once the owner declares the minimum engine, on fewer than 80% fewer questions than the legacy engine.
      - name: Protection gate
        run: npm run engine:gate
      - run: npm run web:build
      - run: npm test
