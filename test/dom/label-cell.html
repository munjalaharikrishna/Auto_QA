<!doctype html>
<meta charset="utf-8">
<title>OrangeHRM style login</title>
<!-- The login of old OrangeHRM: the names are in the table cell before the field ("Password :"), not in a label element. -->
<form id="frmLogin" action="#">
  <table>
    <tr><td>Login Name :</td><td><input type="text" name="txtUserName" id="txtUserName"></td></tr>
    <tr><td>Password :</td><td><input type="password" name="txtPassword"></td></tr>
    <tr><td></td><td><input type="submit" name="Submit" value="LOGIN"> <input type="reset" name="clear" value="Clear"></td></tr>
  </table>
</form>
<p>Forgot your Password : <a href="#reset">reset it</a></p>
