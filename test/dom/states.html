<!doctype html>
<meta charset="utf-8">
<title>States</title>
<p><button id="hid" style="display:none">Hidden Action</button></p>
<p><button id="invisible" style="visibility:hidden">Invisible Action</button></p>
<p><button id="faded" style="opacity:0">Faded Action</button></p>
<p><button id="dis" disabled>Disabled Action</button></p>
<p><span style="position:relative;display:inline-block"><button id="cov">Covered Action</button><span id="shield" style="position:absolute;left:0;top:0;right:0;bottom:0"></span></span></p>
<p><span style="position:relative;display:inline-block;width:110px;height:30px"><button id="stack-under" style="position:absolute;left:0;top:0;width:110px;height:30px">Stacked Action</button><button id="stack-over" style="position:absolute;left:0;top:0;width:110px;height:30px;z-index:5">Stacked Action</button></span></p>
<p><button id="fine">Fine Action</button></p>
